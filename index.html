    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="油爐管理">
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">
    
    <!-- Icons -->

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #0a4d68;
            --primary-light: #088395;
            --accent: #05bfdb;
            --danger: #ef4444;
            --warning: #f59e0b;
            --success: #10b981;
            --dark: #0c1821;
            --dark-secondary: #1a2332;
            --text-primary: #e8eaed;
            --text-secondary: #9ca3af;
            --border: #2d3748;
        }

        body {
            font-family: 'Noto Sans TC', 'Noto Sans Thai', 'Noto Sans', sans-serif;
            background: linear-gradient(135deg, #0c1821 0%, #1a2332 100%);
            color: var(--text-primary);
            min-height: 100vh;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Login Screen */
        .login-screen {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, #0a4d68, #088395);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }

        .login-card {
            background: white;
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 90%;
            max-width: 400px;
            text-align: center;
        }

        .login-logo {
            font-size: 60px;
            margin-bottom: 20px;
        }

        .login-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
            color: #1f2937;
        }

        .login-subtitle {
            font-size: 14px;
            color: #6b7280;
            margin-bottom: 30px;
        }

        .login-input {
            width: 100%;
            padding: 16px;
            background: #f8f9fa;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            font-size: 18px;
            text-align: center;
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 2px;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        .login-input:focus {
            outline: none;
            border-color: var(--accent);
        }

        .login-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, var(--accent), var(--primary-light));
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }

        .login-error {
            color: var(--danger);
            font-size: 14px;
            margin-top: 10px;
            display: none;
        }

        .login-error.show {
            display: block;
        }

        /* Header */
        .header {
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            padding: 25px 30px;
            border-radius: 16px;
            margin-bottom: 30px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-left h1 {
            font-size: 28px;
            font-weight: 900;
            margin-bottom: 4px;
        }

        .header-user {
            font-size: 14px;
            opacity: 0.9;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(16, 185, 129, 0.2);
            padding: 10px 20px;
            border-radius: 24px;
            border: 2px solid var(--success);
            font-weight: 700;
        }

        .status-dot {
            width: 12px;
            height: 12px;
            background: var(--success);
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .logout-btn {
            padding: 10px 20px;
            background: rgba(255,255,255,0.1);
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 10px;
            color: white;
            cursor: pointer;
            font-weight: 600;
        }

        .logout-btn:hover {
            background: rgba(255,255,255,0.2);
        }

        /* Dashboard Grid */
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: var(--dark-secondary);
            padding: 25px;
            border-radius: 16px;
            border: 1px solid var(--border);
            box-shadow: 0 4px 16px rgba(0,0,0,0.3);
            transition: all 0.3s;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 24px rgba(5,191,219,0.3);
        }

        .stat-card.highlight {
            border-color: var(--accent);
            box-shadow: 0 4px 20px rgba(5,191,219,0.4);
        }

        .stat-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .stat-label {
            font-size: 14px;
            color: var(--text-secondary);
        }

        .stat-icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            background: rgba(5,191,219,0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        .stat-value {
            font-size: 36px;
            font-weight: 900;
            font-family: 'Orbitron', sans-serif;
            color: var(--accent);
            margin-bottom: 8px;
        }

        .stat-unit {
            font-size: 14px;
            color: var(--text-secondary);
        }

        .stat-footer {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: var(--text-secondary);
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid var(--border);
        }

        .trend-up {
            color: var(--success);
            font-weight: 600;
        }

        .trend-down {
            color: var(--danger);
            font-weight: 600;
        }

        /* Chart Section */
        .chart-section {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .chart-card {
            background: var(--dark-secondary);
            padding: 25px;
            border-radius: 16px;
            border: 1px solid var(--border);
            box-shadow: 0 4px 16px rgba(0,0,0,0.3);
        }

        .chart-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 20px;
        }

        .chart-container {
            height: 300px;
        }

        /* Records Section */
        .records-section {
            background: var(--dark-secondary);
            padding: 25px;
            border-radius: 16px;
            border: 1px solid var(--border);
            box-shadow: 0 4px 16px rgba(0,0,0,0.3);
        }

        .section-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: var(--dark);
            padding: 15px;
            text-align: left;
            font-size: 13px;
            font-weight: 700;
            color: var(--text-secondary);
        }

        td {
            padding: 15px;
            border-bottom: 1px solid var(--border);
            font-size: 14px;
        }

        tr:hover {
            background: rgba(5,191,219,0.05);
        }

        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }

        .badge-success {
            background: rgba(16,185,129,0.2);
            color: var(--success);
        }

        @media (max-width: 968px) {
            .chart-section {
                grid-template-columns: 1fr;
            }
            .header-content {
                flex-direction: column;
                gap: 15px;
            }
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <!-- Login Screen -->
    <div id="loginScreen" class="login-screen">
        <div class="login-card">
            <div class="login-logo">🔥</div>
            <h2 class="login-title" id="loginTitle">油爐管理系統</h2>
            <p class="login-subtitle" id="loginSubtitle">請輸入工號登入</p>
            <form id="loginForm">
                <input 
                    type="text" 
                    class="login-input" 
                    id="employeeId"
                    placeholder="輸入工號"
                    required
                />
                <button type="submit" class="login-btn" id="loginBtn">登入</button>
                <div class="login-error" id="loginError">工號不存在</div>
            </form>
        </div>
    </div>

    <!-- Main Dashboard -->
    <div id="mainDashboard" class="container hidden">
        <!-- Header -->
        <div class="header">
            <div class="header-content">
                <div class="header-left">
                    <h1 id="systemTitle">8噸油爐智能管理系統</h1>
                    <div class="header-user" id="welcomeMessage">歡迎, 使用者</div>
                </div>
                <div class="header-right">
                    <div class="status-badge">
                        <div class="status-dot"></div>
                        <span id="statusText">運行正常</span>
                    </div>
                    <button class="logout-btn" onclick="logout()" id="logoutBtn">登出</button>
                </div>
            </div>
        </div>

        <!-- Dashboard Stats -->
        <div class="dashboard-grid">
            <div class="stat-card">
                <div class="stat-header">
                    <span class="stat-label" id="label1">當前油量</span>
                    <div class="stat-icon">💧</div>
                </div>
                <div class="stat-value">4523</div>
                <div class="stat-unit" id="unit1">公升 (L)</div>
                <div class="stat-footer">
                    <span class="trend-down">↓ 285L</span>
                    <span id="footer1">今日消耗</span>
                </div>
            </div>

            <div class="stat-card">
                <div class="stat-header">
                    <span class="stat-label" id="label2">今日用水</span>
                    <div class="stat-icon">💦</div>
                </div>
                <div class="stat-value">8550</div>
                <div class="stat-unit" id="unit2">公升 (L)</div>
                <div class="stat-footer">
                    <span id="footer2">今日累計</span>
                </div>
            </div>

            <div class="stat-card highlight">
                <div class="stat-header">
                    <span class="stat-label" id="label3">水煤比</span>
                    <div class="stat-icon">📊</div>
                </div>
                <div class="stat-value">30.0</div>
                <div class="stat-unit" id="unit3">L水/L油</div>
                <div class="stat-footer">
                    <span class="trend-up">✓ <span id="footer3">最佳</span></span>
                    <span>(28-32)</span>
                </div>
            </div>

            <div class="stat-card">
                <div class="stat-header">
                    <span class="stat-label" id="label4">運行時間</span>
                    <div class="stat-icon">⏱️</div>
                </div>
                <div class="stat-value">8.5</div>
                <div class="stat-unit" id="unit4">小時 (hr)</div>
                <div class="stat-footer">
                    <span id="footer4">今日累計</span>
                </div>
            </div>

            <div class="stat-card">
                <div class="stat-header">
                    <span class="stat-label" id="label5">燃燒效率</span>
                    <div class="stat-icon">🔥</div>
                </div>
                <div class="stat-value">92.5</div>
                <div class="stat-unit">%</div>
                <div class="stat-footer">
                    <span class="trend-up">↑ 1.2%</span>
                    <span id="footer5">vs 昨日</span>
                </div>
            </div>
        </div>

        <!-- Chart Section -->
        <div class="chart-section">
            <div class="chart-card">
                <h3 class="chart-title" id="chartTitle">油耗 & 水耗趨勢</h3>
                <div class="chart-container">
                    <canvas id="trendChart"></canvas>
                </div>
            </div>

            <div class="chart-card">
                <h3 class="chart-title" id="paramTitle">即時參數</h3>
                <div style="display: flex; flex-direction: column; gap: 20px; margin-top: 20px;">
                    <div>
                        <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
                            <span style="font-size: 14px; color: var(--text-secondary);" id="temp">爐溫</span>
                            <span style="font-size: 18px; font-weight: 700; color: #f59e0b;">165°C</span>
                        </div>
                        <div style="height: 8px; background: var(--dark); border-radius: 4px;">
                            <div style="height: 100%; width: 82.5%; background: linear-gradient(90deg, #f59e0b, #ef4444); border-radius: 4px;"></div>
                        </div>
                    </div>

                    <div>
                        <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
                            <span style="font-size: 14px; color: var(--text-secondary);" id="pressure">壓力</span>
                            <span style="font-size: 18px; font-weight: 700; color: #10b981;">7.2 bar</span>
                        </div>
                        <div style="height: 8px; background: var(--dark); border-radius: 4px;">
                            <div style="height: 100%; width: 72%; background: linear-gradient(90deg, #10b981, #05bfdb); border-radius: 4px;"></div>
                        </div>
                    </div>

                    <div>
                        <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
                            <span style="font-size: 14px; color: var(--text-secondary);" id="oxygen">氧含量</span>
                            <span style="font-size: 18px; font-weight: 700; color: #05bfdb;">3.8%</span>
                        </div>
                        <div style="height: 8px; background: var(--dark); border-radius: 4px;">
                            <div style="height: 100%; width: 38%; background: linear-gradient(90deg, #05bfdb, #088395); border-radius: 4px;"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Records Section -->
        <div class="records-section">
            <h2 class="section-title" id="recordsTitle">📋 最近運行記錄</h2>
            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr>
                            <th id="th1">時間</th>
                            <th id="th2">操作員</th>
                            <th id="th3">油量起(L)</th>
                            <th id="th4">油量訖(L)</th>
                            <th id="th5">用水(L)</th>
                            <th id="th6">水煤比</th>
                            <th id="th7">狀態</th>
                        </tr>
                    </thead>
                    <tbody id="recordsTbody">
                        <tr><td colspan="7" style="text-align:center; color: var(--text-secondary); padding: 30px;">載入中...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

                pressure: 'ความดัน',
                oxygen: 'ปริมาณออกซิเจน',
                recordsTitle: '📋 บันทึกการดำเนินงานล่าสุด',
                th1: 'เวลา',
                th2: 'ผู้ปฏิบัติงาน',
                th3: 'น้ำมันเริ่มต้น(L)',
                th4: 'น้ำมันสิ้นสุด(L)',
                th5: 'น้ำ(L)',
                th6: 'อัตราส่วนน้ำ/น้ำมัน',
                th7: 'สถานะ'
            }
        };

        let currentUser = null;
        let currentLanguage = 'zh';
        let chartInstance = null;

        // 翻譯函數
        function t(key) {
            return TRANSLATIONS[currentLanguage][key] || key;
        }

        // 更新介面文字
        function updateLanguage() {
            document.getElementById('loginTitle').textContent = t('loginTitle');
            document.getElementById('loginSubtitle').textContent = t('loginSubtitle');
            document.getElementById('employeeId').placeholder = t('loginPlaceholder');
            document.getElementById('loginBtn').textContent = t('loginBtn');
            document.getElementById('loginError').textContent = t('loginError');
            document.getElementById('systemTitle').textContent = t('systemTitle');
            document.getElementById('statusText').textContent = t('statusText');
            document.getElementById('logoutBtn').textContent = t('logoutBtn');
            
            // 更新所有標籤
            for (let i = 1; i <= 7; i++) {
                const el = document.getElementById('label' + i);
                if (el) el.textContent = t('label' + i);
            }
            for (let i = 1; i <= 5; i++) {
                const el = document.getElementById('unit' + i);
                if (el) el.textContent = t('unit' + i);
            }
            for (let i = 1; i <= 5; i++) {
                const el = document.getElementById('footer' + i);
                if (el) el.textContent = t('footer' + i);
            }
            
            document.getElementById('chartTitle').textContent = t('chartTitle');
            document.getElementById('paramTitle').textContent = t('paramTitle');
            document.getElementById('temp').textContent = t('temp');
            document.getElementById('pressure').textContent = t('pressure');
            document.getElementById('oxygen').textContent = t('oxygen');
            document.getElementById('recordsTitle').textContent = t('recordsTitle');
            
            for (let i = 1; i <= 7; i++) {
                const el = document.getElementById('th' + i);
                if (el) el.textContent = t('th' + i);
            }
        }

        // 登入處理
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const id = document.getElementById('employeeId').value.toUpperCase();
            
            if (EMPLOYEE_DATABASE[id]) {
                currentUser = { id, ...EMPLOYEE_DATABASE[id] };
                currentLanguage = currentUser.language;
                updateLanguage();
                
                document.getElementById('welcomeMessage').textContent = 
                    t('welcome') + ', ' + currentUser.name + ' (' + id + ')';
                
                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('mainDashboard').classList.remove('hidden');
                
                initChart();
                loadDashboardData();   // 載入即時儀表板數據
                loadLatestRecords();   // 載入最近運行記錄
                
                // 每 60 秒自動更新一次
                if (window.__refreshTimer) clearInterval(window.__refreshTimer);
                window.__refreshTimer = setInterval(() => {
                    loadDashboardData();
                    loadLatestRecords();
                }, 60000);
            } else {
                document.getElementById('loginError').classList.add('show');
            }
        });

        // 登出
        function logout() {
            currentUser = null;
            currentLanguage = 'zh';
            document.getElementById('loginScreen').classList.remove('hidden');
            document.getElementById('mainDashboard').classList.add('hidden');
            document.getElementById('employeeId').value = '';
            document.getElementById('loginError').classList.remove('show');
            updateLanguage();
        }


        // ========== 從 Google Sheets 即時載入資料 ==========
        async function loadDashboardData() {
            if (GOOGLE_SCRIPT_URL.includes('請換成')) {
                console.warn('⚠️ 尚未設定 GOOGLE_SCRIPT_URL,請打開 index.html 換成你的 Apps Script 部署網址');
                return;
            }
            try {
                const res = await fetch(GOOGLE_SCRIPT_URL + '?action=getDashboardData');
                const json = await res.json();
                if (!json.success) throw new Error(json.message);
                const d = json.data || {};
                
                document.getElementById('statCurrentOil').textContent = (d.currentOil ?? 0).toLocaleString();
                document.getElementById('statTodayOilDelta').textContent = '↓ ' + (d.todayOil ?? 0) + 'L';
                document.getElementById('statWaterUsage').textContent = (d.waterUsage ?? 0).toLocaleString();
                document.getElementById('statWaterFuelRatio').textContent = (d.avgWaterFuelRatio ?? 0).toFixed(1);
                document.getElementById('statRuntime').textContent = (d.runtime ?? 0).toFixed(1);
                document.getElementById('statEfficiency').textContent = (d.efficiency ?? 0).toFixed(1);
                document.getElementById('statEfficiencyDelta').textContent = '✓ 即時';
                
                console.log('✅ 儀表板資料已更新', d);
            } catch (err) {
                console.error('❌ 載入儀表板失敗:', err);
            }
        }
        
        async function loadLatestRecords() {
            if (GOOGLE_SCRIPT_URL.includes('請換成')) return;
            try {
                const res = await fetch(GOOGLE_SCRIPT_URL + '?action=getLatestRecords&type=operation&limit=10');
                const json = await res.json();
                if (!json.success) throw new Error(json.message);
                
                const records = json.data || [];
                const tbody = document.getElementById('recordsTbody');
                
                if (records.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; color: var(--text-secondary); padding: 30px;">尚無資料</td></tr>';
                    return;
                }
                
                tbody.innerHTML = records.map(r => {
                    const ts = r['時間戳記'] ? new Date(r['時間戳記']) : null;
                    const tsStr = ts ? (ts.getFullYear() + '-' +
                        String(ts.getMonth()+1).padStart(2,'0') + '-' +
                        String(ts.getDate()).padStart(2,'0') + ' ' +
                        String(ts.getHours()).padStart(2,'0') + ':' +
                        String(ts.getMinutes()).padStart(2,'0')) : '';
                    const status = r['狀態'] || '';
                    const badgeClass = status === '正常' ? 'badge-success' : 'badge-success';
                    return `<tr>
                        <td>${tsStr}</td>
                        <td>${r['操作員'] || ''}</td>
                        <td>${r['油量起(L)'] ?? ''}</td>
                        <td>${r['油量訖(L)'] ?? ''}</td>
                        <td>${r['用水量(L)'] ?? ''}</td>
                        <td><strong>${r['水煤比'] ?? ''}</strong></td>
                        <td><span class="badge ${badgeClass}">${status}</span></td>
                    </tr>`;
                }).join('');
                
                console.log('✅ 載入 ' + records.length + ' 筆運行記錄');
            } catch (err) {
                console.error('❌ 載入記錄失敗:', err);
                document.getElementById('recordsTbody').innerHTML = 
                    '<tr><td colspan="7" style="text-align:center; color: var(--danger); padding: 30px;">載入失敗:' + err.message + '</td></tr>';
            }
        }

        // 初始化圖表
        function initChart() {
            const ctx = document.getElementById('trendChart').getContext('2d');
            
            if (chartInstance) {
                chartInstance.destroy();
            }

            chartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: ['00:00', '04:00', '08:00', '12:00', '16:00', '20:00', '24:00'],
                    datasets: [
                        {
                            label: t('label1'),
                            data: [4800, 4750, 4680, 4620, 4570, 4540, 4523],
                            borderColor: '#05bfdb',
                            backgroundColor: 'rgba(5, 191, 219, 0.1)',
                            tension: 0.4,
                            fill: true
                        },
                        {
                            label: t('label2'),
                            data: [0, 1500, 3400, 5200, 6800, 7900, 8550],
                            borderColor: '#088395',
                            backgroundColor: 'rgba(8, 131, 149, 0.1)',
                            tension: 0.4,
                            fill: true
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            labels: {
                                color: '#e8eaed',
                                font: { size: 12 }
                            }
                        }
                    },
                    scales: {
                        y: {
                            grid: { color: 'rgba(255,255,255,0.1)' },
                            ticks: { color: '#9ca3af' }
                        },
                        x: {
                            grid: { color: 'rgba(255,255,255,0.1)' },
                            ticks: { color: '#9ca3af' }
                        }
                    }
                }
            });
        }

        // 初始化
        updateLanguage();

        // PWA Service Worker 註冊
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('service-worker.js')
                    .then(registration => {
                        console.log('✅ Service Worker 註冊成功:', registration.scope);
                    })
                    .catch(error => {
                        console.log('❌ Service Worker 註冊失敗:', error);
                    });
            });
        }

        // PWA 安裝提示
        let deferredPrompt;
        const installButton = document.createElement('button');
        installButton.textContent = '📱 安裝 APP';
        installButton.style.cssText = `
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 15px 25px;
            background: linear-gradient(135deg, #05bfdb, #088395);
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(5,191,219,0.4);
            z-index: 1000;
            display: none;
            animation: bounce 2s infinite;
        `;

        // 添加彈跳動畫
        const style = document.createElement('style');
        style.textContent = `
            @keyframes bounce {
                0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
                40% { transform: translateY(-10px); }
                60% { transform: translateY(-5px); }
            }
        `;
        document.head.appendChild(style);
        document.body.appendChild(installButton);

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            installButton.style.display = 'block';
        });

        installButton.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                console.log(`用戶選擇: ${outcome}`);
                deferredPrompt = null;
                installButton.style.display = 'none';
            }
        });

        // 已安裝後隱藏按鈕
        window.addEventListener('appinstalled', () => {
            console.log('✅ PWA 已安裝!');
            installButton.style.display = 'none';
        });
    </script>
</body>
</html>
