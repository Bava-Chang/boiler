<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">

    <meta name="theme-color" content="#0a4d68">
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
    
    <title>油爐數據錄入 | Nhập liệu lò dầu | ป้อนข้อมูลเตา</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Sans+Thai:wght@400;500;700&family=Noto+Sans:wght@400;500;700&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --primary: #0a4d68;
            --primary-light: #088395;
            --accent: #05bfdb;
            --success: #10b981;
            --danger: #ef4444;
            --bg-primary: #f8f9fa;
            --bg-secondary: #ffffff;
            --text-primary: #1f2937;
            --text-secondary: #6b7280;
            --border: #e5e7eb;
        }

        body {
            font-family: 'Noto Sans TC', 'Noto Sans Thai', 'Noto Sans', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            padding-bottom: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Login Screen */
        .login-screen {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, #0a4d68 0%, #088395 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            padding: 20px;
        }

        .login-card {
            background: white;
            padding: 40px 30px;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 360px;
            text-align: center;
        }

        .login-logo {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, var(--accent), var(--primary-light));
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 40px;
        }

        .login-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--text-primary);
        }

        .login-subtitle {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 30px;
        }

        .login-input {
            width: 100%;
            padding: 16px;
            background: var(--bg-primary);
            border: 2px solid var(--border);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 18px;
            text-align: center;
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 2px;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        .login-input:focus {
            outline: none;
            border-color: var(--accent);
            background: white;
        }

        .login-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, var(--accent), var(--primary-light));
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 16px rgba(5, 191, 219, 0.4);
        }

        .login-btn:active {
            transform: scale(0.98);
        }

        .login-error {
            color: var(--danger);
            font-size: 14px;
            margin-top: 10px;
            display: none;
        }

        .login-error.show {
            display: block;
        }

        /* Header */
        .header {
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            color: white;
            padding: 20px;
            border-radius: 16px;
            margin-bottom: 20px;
            box-shadow: 0 4px 12px rgba(10, 77, 104, 0.3);
        }

        .header-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .header-user {
            font-size: 14px;
            opacity: 0.9;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logout-btn-mobile {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            padding: 6px 14px;
            border-radius: 8px;
            color: white;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }

        /* Status */
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            background: rgba(16, 185, 129, 0.1);
            color: var(--success);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--success);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* Type Selector */
        .type-selector {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .type-btn {
            padding: 16px;
            background: var(--bg-secondary);
            border: 2px solid var(--border);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
            font-size: 15px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .type-btn.active {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
            box-shadow: 0 4px 12px rgba(10, 77, 104, 0.3);
        }

        .type-btn:active {
            transform: scale(0.98);
        }

        /* Form Card */
        .form-card {
            background: var(--bg-secondary);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            margin-bottom: 20px;
        }

        .form-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 20px;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .required {
            color: var(--danger);
        }

        .form-input,
        .form-select {
            width: 100%;
            padding: 14px;
            border: 2px solid var(--border);
            border-radius: 10px;
            font-size: 16px;
            color: var(--text-primary);
            background: var(--bg-primary);
            transition: all 0.3s;
        }

        .form-input:focus,
        .form-select:focus {
            outline: none;
            border-color: var(--accent);
            background: white;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .input-unit {
            position: relative;
        }

        .input-unit .unit {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            font-size: 14px;
            pointer-events: none;
        }

        .input-unit input {
            padding-right: 45px;
        }

        /* Water-Fuel Ratio Display */
        .calculation-display {
            background: linear-gradient(135deg, rgba(5, 191, 219, 0.1), rgba(8, 131, 149, 0.1));
            border: 2px solid var(--accent);
            border-radius: 12px;
            padding: 16px;
            margin-top: 20px;
            text-align: center;
        }

        .calc-label {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .calc-value {
            font-size: 32px;
            font-weight: 900;
            font-family: 'Orbitron', sans-serif;
            color: var(--accent);
            text-shadow: 0 2px 8px rgba(5, 191, 219, 0.3);
        }

        .calc-unit {
            font-size: 14px;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        .calc-status {
            margin-top: 8px;
            font-size: 13px;
            font-weight: 600;
        }

        .calc-status.optimal {
            color: var(--success);
        }

        .calc-status.warning {
            color: var(--danger);
        }

        /* Submit Button */
        .submit-section {
            position: sticky;
            bottom: 20px;
            margin-top: 30px;
        }

        .submit-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, var(--accent), var(--primary-light));
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 16px rgba(5, 191, 219, 0.4);
        }

        .submit-btn:active {
            transform: scale(0.98);
        }

        .submit-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Toast */
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: var(--success);
            color: white;
            padding: 16px 24px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
            z-index: 1000;
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            min-width: 280px;
            text-align: center;
            font-weight: 600;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        .toast.error {
            background: var(--danger);
        }

        /* Loading */
        .loading-spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .submit-btn.loading .btn-text {
            display: none;
        }

        .submit-btn.loading .loading-spinner {
            display: block;
        }

        /* Helper Text */
        .helper-text {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 6px;
        }

        @media (max-width: 480px) {
            .container {
                padding: 12px;
            }
            
            .header {
                padding: 16px;
            }
            
            .form-card {
                padding: 20px;
            }
            
            .form-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

                selectType: 'เลือกประเภท',

                weeklyCheck: 'ตรวจสอบรายสัปดาห์',

                repair: 'ซ่อมแซมเสียหาย',
                emergencyRepair: 'ซ่อมแซมฉุกเฉิน',

                submitting: 'กำลังส่ง...',
                submitSuccess: '✅ ส่งสำเร็จ!',
                submitError: '❌ ส่งไม่สำเร็จ กรุณาลองใหม่',

        // 主應用程式
        class App {
            constructor() {
                this.currentUser = null;
                this.language = 'zh';
                this.currentType = 'operation';
                this.formData = {};
                
                this.init();
            }

            init() {
                // 從 URL 參數取得類型
                const urlParams = new URLSearchParams(window.location.search);
                const typeParam = urlParams.get('type');
                if (typeParam) {
                    this.currentType = typeParam;
                }

                this.renderLogin();
            }

            t(key) {
                return TRANSLATIONS[this.language][key] || key;
            }

            renderLogin() {
                document.getElementById('root').innerHTML = `
                    <div class="login-screen">
                        <div class="login-card">
                            <div class="login-logo">🔥</div>
                            <h2 class="login-title">${this.t('loginTitle')}</h2>
                            <p class="login-subtitle">${this.t('loginSubtitle')}</p>
                            <form id="loginForm">
                                <input 
                                    type="text" 
                                    class="login-input" 
                                    id="employeeId"
                                    placeholder="${this.t('loginPlaceholder')}"
                                    required
                                    autocomplete="off"
                                />
                                <button type="submit" class="login-btn">
                                    ${this.t('loginButton')}
                                </button>
                                <div class="login-error" id="loginError">
                                    ${this.t('loginError')}
                                </div>
                            </form>
                        </div>
                    </div>
                `;

                document.getElementById('loginForm').addEventListener('submit', (e) => this.handleLogin(e));
            }

            handleLogin(e) {
                e.preventDefault();
                const id = document.getElementById('employeeId').value.toUpperCase();
                
                if (EMPLOYEE_DATABASE[id]) {
                    const user = EMPLOYEE_DATABASE[id];
                    this.currentUser = { id, ...user };
                    this.language = user.language;
                    this.renderMain();
                } else {
                    document.getElementById('loginError').classList.add('show');
                }
            }

            handleLogout() {
                this.currentUser = null;
                this.language = 'zh';
                this.renderLogin();
            }

            switchForm(type) {
                this.currentType = type;
                this.formData = {};
                this.renderMain();
            }

            calculateWaterFuelRatio() {
                const oilStart = parseFloat(this.formData.oilStart) || 0;
                const oilEnd = parseFloat(this.formData.oilEnd) || 0;
                const water = parseFloat(this.formData.water) || 0;
                
                const oilConsumption = oilStart - oilEnd;
                
                if (oilConsumption > 0 && water > 0) {
                    const ratio = (water / oilConsumption).toFixed(2);
                    const isOptimal = ratio >= 28 && ratio <= 32;
                    
                    return {
                        ratio: ratio,
                        isOptimal: isOptimal,
                        status: isOptimal ? 'optimal' : 'warning'
                    };
                }
                
                return null;
            }

            updateWaterFuelDisplay() {
                const display = document.getElementById('waterFuelDisplay');
                if (!display) return;

                const calc = this.calculateWaterFuelRatio();
                
                if (calc) {
                    display.innerHTML = `
                        <div class="calc-label">${this.t('waterFuelRatio')}</div>
                        <div class="calc-value">${calc.ratio}</div>
                        <div class="calc-unit">${this.t('literPerLiter')}</div>
                        <div class="calc-status ${calc.status}">
                            ${calc.isOptimal ? '✓ ' + this.t('optimal') : '⚠ ' + this.t('warning')}
                            (28-32)
                        </div>
                    `;
                    display.style.display = 'block';
                } else {
                    display.style.display = 'none';
                }
            }

            renderMain() {
                const typeButtons = [
                    { type: 'operation', label: this.t('operationRecord') },
                    { type: 'water', label: this.t('waterQuality') },
                    { type: 'chemical', label: this.t('chemicalRecord') },
                    { type: 'maintenance', label: this.t('maintenance') }
                ];

                document.getElementById('root').innerHTML = `
                    <div class="container">
                        <div class="header">
                            <div class="header-title">🔥 ${this.t('loginTitle')}</div>
                            <div class="header-user">
                                <span>${this.t('welcome')}, ${this.currentUser.name}</span>
                                <button class="logout-btn-mobile" onclick="app.handleLogout()">
                                    ${this.t('logout')}
                                </button>
                            </div>
                        </div>

                        <div style="text-align: center; margin-bottom: 20px;">
                            <div class="status-badge">
                                <div class="status-dot"></div>
                                <span>${this.t('statusOnline')}</span>
                            </div>
                        </div>

                        <div class="type-selector">
                            ${typeButtons.map(btn => `
                                <button 
                                    class="type-btn ${this.currentType === btn.type ? 'active' : ''}"
                                    onclick="app.switchForm('${btn.type}')"
                                >
                                    ${btn.label}
                                </button>
                            `).join('')}
                        </div>

                        <div class="form-card">
                            <form id="dataForm">
                                ${this.renderFormContent()}
                                <div class="submit-section">
                                    <button type="submit" class="submit-btn" id="submitBtn">
                                        <span class="btn-text">${this.t('submit')}</span>
                                        <div class="loading-spinner"></div>
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                `;

                document.getElementById('dataForm').addEventListener('submit', (e) => this.handleSubmit(e));
                
                // 如果是運行記錄,監聽輸入變化以計算水煤比
                if (this.currentType === 'operation') {
                    ['oilStart', 'oilEnd', 'water'].forEach(field => {
                        const input = document.getElementById(field);
                        if (input) {
                            input.addEventListener('input', () => {
                                this.formData[field] = input.value;
                                this.updateWaterFuelDisplay();
                            });
                        }
                    });
                }
            }

            renderFormContent() {
                switch(this.currentType) {
                    case 'operation':
                        return `
                            <div class="form-title">📊 ${this.t('operationRecord')}</div>
                            
                            <div class="form-row">
                                <div class="form-group">
                                    <label class="form-label">${this.t('oilStart')} <span class="required">*</span></label>
                                    <div class="input-unit">
                                        <input type="number" id="oilStart" class="form-input" placeholder="0" step="0.1" required>
                                        <span class="unit">${this.t('liter')}</span>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="form-label">${this.t('oilEnd')} <span class="required">*</span></label>
                                    <div class="input-unit">
                                        <input type="number" id="oilEnd" class="form-input" placeholder="0" step="0.1" required>
                                        <span class="unit">${this.t('liter')}</span>
                                    </div>
                                </div>
                            </div>

                            <div class="form-row">
                                <div class="form-group">
                                    <label class="form-label">${this.t('water')} <span class="required">*</span></label>
                                    <div class="input-unit">
                                        <input type="number" id="water" class="form-input" placeholder="0" required>
                                        <span class="unit">${this.t('liter')}</span>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="form-label">${this.t('runtime')} <span class="required">*</span></label>
                                    <div class="input-unit">
                                        <input type="number" id="runtime" class="form-input" placeholder="0" step="0.1" required>
                                        <span class="unit">${this.t('hour')}</span>
                                    </div>
                                </div>
                            </div>

                            <div class="calculation-display" id="waterFuelDisplay" style="display: none;"></div>

                            <div class="form-group">
                                <label class="form-label">${this.t('note')}</label>
                                <input type="text" id="note" class="form-input" placeholder="${this.t('optional')}">
                                <div class="helper-text">${this.t('optional')}</div>
                            </div>
                        `;

                    case 'water':
                        return `
                            <div class="form-title">💧 ${this.t('waterQuality')}</div>
                            
                            <div class="form-row">
                                <div class="form-group">
                                    <label class="form-label">${this.t('phValue')} <span class="required">*</span></label>
                                    <input type="number" id="ph" class="form-input" placeholder="7.0" step="0.1" required>
                                    <div class="helper-text">${this.t('standard')}: 6.5-8.5</div>
                                </div>
                                <div class="form-group">
                                    <label class="form-label">${this.t('hardness')} <span class="required">*</span></label>
                                    <div class="input-unit">
                                        <input type="number" id="hardness" class="form-input" placeholder="0" required>
                                        <span class="unit">ppm</span>
                                    </div>
                                    <div class="helper-text">${this.t('standard')}: <100</div>
                                </div>
                            </div>

                            <div class="form-row">
                                <div class="form-group">
                                    <label class="form-label">${this.t('chloride')} <span class="required">*</span></label>
                                    <div class="input-unit">
                                        <input type="number" id="chloride" class="form-input" placeholder="0" required>
                                        <span class="unit">ppm</span>
                                    </div>
                                    <div class="helper-text">${this.t('standard')}: <50</div>
                                </div>
                                <div class="form-group">
                                    <label class="form-label">${this.t('conductivity')} <span class="required">*</span></label>
                                    <div class="input-unit">
                                        <input type="number" id="conductivity" class="form-input" placeholder="0" required>
                                        <span class="unit">μS/cm</span>
                                    </div>
                                    <div class="helper-text">${this.t('standard')}: <250</div>
                                </div>
                            </div>
                        `;

                    case 'chemical':
                        return `
                            <div class="form-title">💊 ${this.t('chemicalRecord')}</div>
                            
                            <div class="form-group">
                                <label class="form-label">${this.t('chemicalType')} <span class="required">*</span></label>
                                <select id="type" class="form-select" required>
                                    <option value="">${this.t('selectType')}</option>
                                    <option value="阻垢劑">阻垢劑</option>
                                    <option value="防腐劑">防腐劑</option>
                                    <option value="除氧劑">除氧劑</option>
                                    <option value="pH調整劑">pH調整劑</option>
                                    <option value="其他">其他</option>
                                </select>
                            </div>

                            <div class="form-group">
                                <label class="form-label">${this.t('amount')} <span class="required">*</span></label>
                                <div class="input-unit">
                                    <input type="number" id="amount" class="form-input" placeholder="0" step="0.1" required>
                                    <span class="unit">${this.t('liter')}</span>
                                </div>
                            </div>

                            <div class="form-group">
                                <label class="form-label">${this.t('note')}</label>
                                <input type="text" id="note" class="form-input" placeholder="${this.t('optional')}">
                            </div>
                        `;

                    case 'maintenance':
                        return `
                            <div class="form-title">🔧 ${this.t('maintenance')}</div>
                            
                            <div class="form-group">
                                <label class="form-label">${this.t('maintenanceType')} <span class="required">*</span></label>
                                <select id="type" class="form-select" required>
                                    <option value="">${this.t('selectType')}</option>
                                    <option value="日檢">${this.t('dailyCheck')}</option>
                                    <option value="週檢">${this.t('weeklyCheck')}</option>
                                    <option value="月檢">${this.t('monthlyCheck')}</option>
                                    <option value="故障維修">${this.t('repair')}</option>
                                    <option value="緊急維修">${this.t('emergencyRepair')}</option>
                                </select>
                            </div>

                            <div class="form-group">
                                <label class="form-label">${this.t('items')} <span class="required">*</span></label>
                                <input type="text" id="items" class="form-input" placeholder="" required>
                            </div>

                            <div class="form-group">
                                <label class="form-label">${this.t('nextDate')}</label>
                                <input type="date" id="nextDate" class="form-input">
                            </div>
                        `;
                }
            }

            async handleSubmit(e) {
                e.preventDefault();
                
                const submitBtn = document.getElementById('submitBtn');
                submitBtn.classList.add('loading');
                submitBtn.disabled = true;

                // 收集表單數據
                const form = document.getElementById('dataForm');
                const formData = new FormData(form);
                const data = {};
                
                // 根據表單類型收集不同欄位
                const fields = this.getFormFields();
                fields.forEach(field => {
                    const element = document.getElementById(field);
                    if (element) {
                        data[field] = element.value;
                    }
                });

                // 計算水煤比
                if (this.currentType === 'operation') {
                    const calc = this.calculateWaterFuelRatio();
                    if (calc) {
                        data.waterFuelRatio = calc.ratio;
                    }
                }

                try {
                    // 注意:不設 Content-Type header,讓瀏覽器以 text/plain 送出
                    // 這樣可避免 CORS preflight,Apps Script 仍能用 e.postData.contents 取得 JSON 字串
                    const response = await fetch(GOOGLE_SCRIPT_URL, {
                        method: 'POST',
                        body: JSON.stringify({
                            type: this.currentType,
                            data: {
                                ...data,
                                operator: this.currentUser.name,
                                employeeId: this.currentUser.id
                            },
                            timestamp: new Date().toISOString()
                        })
                    });

                    if (!response.ok) {
                        throw new Error('HTTP ' + response.status);
                    }

                    const result = await response.json();

                    if (result.success) {
                        this.showToast(this.t('submitSuccess'), 'success');
                        setTimeout(() => {
                            form.reset();
                            this.formData = {};
                            const display = document.getElementById('waterFuelDisplay');
                            if (display) display.style.display = 'none';
                        }, 1500);
                    } else {
                        console.error('後端錯誤:', result.message);
                        this.showToast('❌ ' + (result.message || this.t('submitError')), 'error');
                    }

                } catch (error) {
                    console.error('提交失敗:', error);
                    this.showToast(this.t('submitError') + ' (' + error.message + ')', 'error');
                } finally {
                    submitBtn.classList.remove('loading');
                    submitBtn.disabled = false;
                }
            }

            getFormFields() {
                switch(this.currentType) {
                    case 'operation':
                        return ['oilStart', 'oilEnd', 'water', 'runtime', 'note'];
                    case 'water':
                        return ['ph', 'hardness', 'chloride', 'conductivity'];
                    case 'chemical':
                        return ['type', 'amount', 'note'];
                    case 'maintenance':
                        return ['type', 'items', 'nextDate'];
                    default:
                        return [];
                }
            }

            showToast(message, type = 'success') {
                const toast = document.getElementById('toast');
                toast.textContent = message;
                toast.className = `toast ${type} show`;

                setTimeout(() => {
                    toast.classList.remove('show');
                }, 3000);
            }
        }

        // 初始化應用程式
        const app = new App();
    </script>
</body>
</html>
